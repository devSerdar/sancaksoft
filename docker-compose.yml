services:
  # PostgreSQL Database
  sancaksoft-db:
    image: postgres:16-alpine
    container_name: sancaksoft-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sancaksoft
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - sancaksoft-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # Go Backend API
  sancaksoft-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sancaksoft-backend
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://postgres:password@sancaksoft-db:5432/sancaksoft?sslmode=disable
      PORT: "8080"
    depends_on:
      sancaksoft-db:
        condition: service_healthy
    networks:
      - sancaksoft-network
    restart: always

  # Next.js Frontend
  sancaksoft-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sancaksoft-frontend
    ports:
      - "3000:3000"
    depends_on:
      - sancaksoft-backend
    networks:
      - sancaksoft-network
    restart: always

networks:
  sancaksoft-network:
    driver: bridge

volumes:
  postgres_data:

# Usage:
# Start all services:       docker-compose up -d
# View logs:                docker-compose logs -f
# Stop all services:        docker-compose down
# Rebuild after changes:    docker-compose up -d --build
# Reset database:           docker-compose down -v && docker-compose up -d
